name: Deploy Monti Edge Gateway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # Binds to environment settings 19045711986

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker Engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYS_OWNER: ${{ vars.SYS_OWNER }}
          SYS_NEURAL_SIGNATURE: ${{ vars.SYS_NEURAL_SIGNATURE }}
          SYS_AUTH_CODE: ${{ secrets.SYS_AUTH_CODE }}
          SYS_ROUTING_DOMAIN: ${{ vars.SYS_ROUTING_DOMAIN }}
        run: npx wrangler deploy
